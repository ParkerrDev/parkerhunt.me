# The URL the site will be built for
base_url = "https://parkerhunt.me"
title = "Parker Hunt"
description = "Andrew Parker Hunt, cofounder of Kite. Building software, hardware, and a tabletop printer for circuit boards."
author = "Andrew Parker Hunt"

# Compile sass/main.scss (and its partials) to /main.css
compile_sass = false

# Zola's search index is an 84 KB payload (index + elasticlunr) that nothing on
# this site loads. Turn it back on the same day a search box appears.
build_search_index = false

# Strip comments and inter-tag whitespace from the generated HTML.
minify_html = true

# Every page's <head> links /rss.xml. Without these two keys Zola does not emit
# it, and that link 404s.
generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = []

[markdown]
# Adds loading="lazy" decoding="async" to images in markdown content. Syntax
# highlighting stays off, nothing here posts code, and it would add a payload.
lazy_async_image = true

[extra]
# The blog is on. To take it down, set this to false AND put `draft = true`
# back in content/blog/_index.md (see the note there): this hides the home
# page's Blog row and the nav link, the draft removes the pages themselves.
blog = true
