# The idea notebook. Rendered on /ideas in full; the home page shows the first
# nine and links through.
#
# Order is chronological-ish, not ranked. `tag` is a single word used for the
# little uppercase label — keep the vocabulary small so the page stays calm:
# hardware, software, ai, web, infra, space, consumer, business, health,
# robotics, fun.

[[idea]]
name = "Electrically tinted windows"
tag = "hardware"
blurb = "Tint on a dial, for houses and cars. In a car, sun- and eye-tracking darkens only the part of the glass that is actually blinding the driver."

