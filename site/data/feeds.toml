# NOTE: the [li] block below is NO LONGER RENDERED. The home page shows the X
# posts only, as a horizontal rail — see #posts in templates/index.html. The
# data is left here rather than deleted so putting the feed back is a template
# change and not a retyping job.

# The X and LinkedIn feeds.
#
# WHY THESE ARE HAND-WRITTEN RATHER THAN FETCHED
#
# X: the account is protected. There is no public timeline, no RSS and no
# unauthenticated API to read it — and even if there were, auto-republishing a
# protected account onto a public page would defeat the point of it being
# protected. So posts are chosen and copied here deliberately.
#
# LinkedIn: has no public posts API at all, for anyone, at any price tier. Every
# "LinkedIn feed widget" you have seen is either a scraper that breaks monthly
# or a paid middleman. Neither belongs in a page that is meant to load in one
# request.
#
# The upside of doing it this way: no third-party script, no tracking pixel, no
# iframe, no runtime request, and the feed renders at the same speed as the rest
# of the page. The cost is that it is a manual copy. That trade is the right way
# round for a personal site.
#
# EVERY ENTRY BELOW IS A PLACEHOLDER. `sample = true` puts a visible banner on
# the feed so a prototype can never be mistaken for the real thing. Replace the
# text with real posts and delete the `sample` line — the banner disappears on
# its own once no entry is marked.

