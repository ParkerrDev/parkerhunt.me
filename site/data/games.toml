# The part of /games/ that Steam does not know about.
#
# site/data/steam.json is generated (library, wishlist, prices, review scores,
# capsule art). This file is the human half: which four are the favourites, and
# the full list of everything ever finished, including the games that were never
# on Steam in the first place.
#
# `appid` links a row to the Steam snapshot, which is where its name, store link
# and local capsule art come from, so a title never has to be typed twice and
# can never drift from what Steam calls it. Leave it empty for anything not on
# Steam and give it a `title` and a `where` instead.
#
# The appids are strings, not numbers, because the template looks them up as
# steam.by_appid[appid] and Tera will only subscript a map with a string.
#
# Adding an appid here that is neither owned nor wishlisted? Add it to the
# `extra` array in site/data/steam-seed.json too, or the lookup misses and the
# row silently disappears.

# ------------------------------------------------------------- favourites --
# Four, in order. Rendered large, with art.
[[favourite]]
appid = "264710"
note = "An alien ocean, no guns, and one wrecked lifepod."

