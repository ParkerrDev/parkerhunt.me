# ------------------------------------------------------------------ quotes --
# Attributed exactly as recorded. Heads up: several of the best-known lines
# floating around under Einstein's name are misattributed — the ones here are
# the ones that hold up. See /quotes for the full wall.
[[quotes]]
text = "Few are those who see with their own eyes and feel with their own hearts."
who = "Albert Einstein"

[[quotes]]
text = "The important thing is not to stop questioning. Curiosity has its own reason for existence."
who = "Albert Einstein"

[[quotes]]
text = "Everything should be made as simple as possible, but not simpler."
who = "Albert Einstein"

[[quotes]]
text = "Concern for man and his fate must always form the chief interest of all technical endeavors. Never forget this in the midst of your diagrams and equations."
who = "Albert Einstein"

[[quotes]]
text = "No amount of experimentation can ever prove me right; a single experiment can prove me wrong."
who = "Albert Einstein"

[[quotes]]
text = "He who does not understand your silence will probably not understand your words."
who = "Elbert Hubbard"

[[quotes]]
text = "Tell me and I forget. Teach me and I remember. Involve me and I learn."
who = "Benjamin Franklin"

[[quotes]]
text = "By failing to prepare, you are preparing to fail."
who = "Benjamin Franklin"

[[quotes]]
text = "Being ignorant is not so much a shame, as being unwilling to learn."
who = "Benjamin Franklin"

[[quotes]]
text = "Genius is patience."
who = "Isaac Newton"

[[quotes]]
text = "A coin a day makes a thousand coins in a thousand days. In time, a rope may saw through a tree, and dripping water can wear away stone."
who = "Zhang Guiyai, Southern Song"

[[quotes]]
text = "The endless passage of time has cast an obfuscating fog over the facts."
who = "unattributed"

[[quotes]]
text = "The years of anxious searching in the dark, with their intense longing, their alternations of confidence and exhaustion, and final emergence into light — only those who have experienced it can understand that."
who = "Albert Einstein"

[[quotes]]
text = "I have no special talent. I am only passionately curious."
who = "Albert Einstein"

[[quotes]]
text = "Invention is not the product of logical thought, even though the final product is tied to a logical structure."
who = "Albert Einstein"

[[quotes]]
text = "Science can flourish only in an atmosphere of free speech."
who = "Albert Einstein"

[[quotes]]
text = "It is, in fact, nothing short of a miracle that the modern methods of instruction have not yet entirely strangled the holy curiosity of inquiry."
who = "Albert Einstein"

[[quotes]]
text = "I speak to everyone in the same way, whether he is the garbage man or the president of the university."
who = "Albert Einstein"

[[quotes]]
text = "Unthinking respect for authority is the greatest enemy of truth."
who = "Albert Einstein"

[[quotes]]
text = "Look deep into nature, and then you will understand everything better."
who = "Albert Einstein"

[[quotes]]
text = "A table, a chair, a bowl of fruit and a violin; what else does a man need to be happy?"
who = "Albert Einstein"

[[quotes]]
text = "Life is like riding a bicycle. To keep your balance you must keep moving."
who = "Albert Einstein"

[[quotes]]
text = "Anyone who doesn't take truth seriously in small matters cannot be trusted in large ones either."
who = "Albert Einstein"

[[quotes]]
text = "I live in that solitude which is painful in youth, but delicious in the years of maturity."
who = "Albert Einstein"

