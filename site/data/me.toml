books_mine = []

# Ranked. Order in the file is the ranking.
# [[films]]  title = "" ; year = 0 ; note = ""
films = []

# [[shows]]  title = "" ; year = 0 ; note = ""
shows = []

# Corners of the web worth keeping.
# [[sites]]  name = "" ; url = "" ; note = ""
sites = []

# Duolingo. `pct` drives the bar (0–100); use whatever you want it to mean —
# course completion is the honest one.
# [[languages]]  name = "Mandarin" ; level = "Section 1, Unit 12" ; pct = 14 ; streak = 0
languages = []

