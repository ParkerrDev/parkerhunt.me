# Everything personal and small on the home page lives here.
#
# Read at build time with load_data(). Every section that reads this file is
# wrapped in a length check, so an empty array simply removes that section from
# the page rather than leaving a heading over nothing. That is deliberate: it
# means you can fill these in whenever you like and the site never looks broken
# in the meantime.
#
# TO FILL IN (currently empty, so the section is hidden):
#   [[books_read]]  [[books_mine]]  [[films]]  [[shows]]
#   [[sites]]       [[languages]]   [chess]

# --------------------------------------------------------------------- hero --
# The strip that rolls under the name. Six is not arbitrary: the CSS animation
# steps through exactly this many frames, so if you add or remove one, update
# steps(--tid-n) — the count is passed in from the template, so it stays in sync
# automatically as long as the keyframe math stays proportional.
tidbits = [
  "1st-degree black belt · 12 years",
  "summited Mt. Whitney at 13, in a thunderstorm",
  "linux daily driver, no windows",
  "favourite fruit: the cherry plum",
  "currently learning Mandarin",
  "this site ships zero javascript",
]

# The fact pills under the hero. Short, checkable, not a personality quiz.
facts = [
  "Clovis, California",
  "student",
  "software · security",
  "Half Dome at 6",
  "El Capitan at 8",
  "Mt. Whitney at 13",
]

# Your own. Empty for now — anything added here renders in the same wall,
# marked as yours with a dashed border.
my_quotes = []

# --------------------------------------------------- EMPTY — FILL THESE IN --
